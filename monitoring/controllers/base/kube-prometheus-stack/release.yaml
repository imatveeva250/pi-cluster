apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "66.7.1"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  valuesFrom:
    - kind: ConfigMap
      name: kube-state-metrics-flux-values
      valuesKey: values.yaml
  values:
    grafana:
      admin:
        existingSecret: grafana-secret
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: tailscale
        hosts:
          - grafana
        tls:
          - hosts:
              - grafana
      grafana.ini:
        server:
          domain: grafana.tail184043.ts.net
          root_url: "https://grafana.tail184043.ts.net"
      resources:
        requests:
          cpu: 20m
          memory: 144Mi
        limits:
          memory: 320Mi
      sidecar:
        resources:
          requests:
            cpu: 5m
            memory: 104Mi
          limits:
            memory: 160Mi
    alertmanager:
      alertmanagerSpec:
        secrets:
          - alertmanager-telegram
          - alertmanager-healthchecks
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            memory: 96Mi
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 1Gi
      config:
        route:
          receiver: telegram
          group_by: ["alertname", "namespace"]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          routes:
            - receiver: healthchecks
              matchers:
                - alertname = "Watchdog"
              group_wait: 0s
              group_interval: 1m
              repeat_interval: 1m
            - receiver: "null"
              matchers:
                - alertname = "InfoInhibitor"
        receivers:
          - name: "null"
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
                chat_id: 2032683559
                send_resolved: true
          - name: healthchecks
            webhook_configs:
              - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks/ping-url
                send_resolved: false
    prometheus:
      prometheusSpec:
        retention: 10d
        retentionSize: 5GB
        resources:
          requests:
            cpu: 100m
            memory: 640Mi
          limits:
            memory: 1Gi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 8Gi
    prometheusOperator:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi
      prometheusConfigReloader:
        resources:
          requests:
            cpu: 5m
            memory: 24Mi
          limits:
            memory: 64Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 5m
          memory: 32Mi
        limits:
          memory: 96Mi
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 64Mi
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
