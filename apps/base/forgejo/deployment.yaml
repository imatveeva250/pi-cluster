apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      labels:
        app: forgejo
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000

      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /pvc/data 
              chown -R 1000:1000 /pvc/data
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: forgejo-data
              mountPath: /pvc

      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:15.0.7-rootless
          envFrom:
            - configMapRef:
                name: forgejo-configmap
          ports:
            - containerPort: 3000
              name: http

          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: forgejo-data
              mountPath: /var/lib/gitea
              subPath: data

      volumes:
        - name: forgejo-data
          persistentVolumeClaim:
            claimName: forgejo-data-pvc
