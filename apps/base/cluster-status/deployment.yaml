apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-status
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-status
  template:
    metadata:
      labels:
        app: cluster-status
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001

      containers:
        - name: cluster-status
          image: ghcr.io/imatveeva250/cluster-status:0.1.1
          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
