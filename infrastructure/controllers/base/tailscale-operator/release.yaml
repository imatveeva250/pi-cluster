apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  releaseName: tailscale-operator
  chart:
    spec:
      chart: tailscale-operator
      version: "1.104.7"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: tailscale
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: Secret
      name: tailscale-operator-values
      valuesKey: values.yaml
  values:
    operatorConfig:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          memory: 128Mi
    proxyConfig:
      defaultProxyClass: default
