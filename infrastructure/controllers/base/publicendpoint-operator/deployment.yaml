apiVersion: apps/v1
kind: Deployment
metadata:
  name: publicendpoint-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: publicendpoint-operator
  template:
    metadata:
      labels:
        app: publicendpoint-operator
    spec:
      serviceAccountName: publicendpoint-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001

      containers:
        - name: operator
          image: ghcr.io/imatveeva250/publicendpoint-operator:0.2.0
          ports:
            - name: health
              containerPort: 8080
            - name: metrics
              containerPort: 8000

          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
