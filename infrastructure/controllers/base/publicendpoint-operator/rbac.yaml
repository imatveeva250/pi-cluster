apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: publicendpoint-operator
rules:
  - apiGroups: ["homelab.matveeva.dev"]
    resources: ["publicendpoints"]
    verbs: ["list", "watch", "patch"]
  - apiGroups: ["homelab.matveeva.dev"]
    resources: ["publicendpoints/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: publicendpoint-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: publicendpoint-operator
subjects:
  - kind: ServiceAccount
    name: publicendpoint-operator
    namespace: publicendpoint-operator
